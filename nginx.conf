server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pretty + explicit .html paths; fall back to 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
